# Configuration git-cliff — génération automatique du CHANGELOG et calcul de version.
# https://git-cliff.org
[changelog]
header = """
# Changelog

Toutes les modifications notables de Hestia sont documentées ici.
Le format suit [Conventional Commits](https://www.conventionalcommits.org/fr/)
et le versionnage suit [SemVer](https://semver.org/lang/fr/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}\
        - {{ commit.message | upper_first }}{% if commit.breaking %} **(rupture)**{% endif %}
    {% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "🚀 Fonctionnalités" },
    { message = "^fix", group = "🐛 Corrections" },
    { message = "^perf", group = "⚡ Performances" },
    { message = "^refactor", group = "♻️ Refactorisations" },
    { message = "^docs", group = "📝 Documentation" },
    { message = "^test", group = "✅ Tests" },
    { message = "^ci", group = "🤖 Intégration continue" },
    { message = "^build", group = "📦 Build" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "🧹 Divers" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true

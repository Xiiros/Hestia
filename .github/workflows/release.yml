name: Release

# Déclenché quand un tag de version est poussé (depuis une branche release/X.Y).
# Construit et signe l'artefact de mise à jour, puis crée la Release GitHub.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"      # versions stables
      - "v[0-9]+.[0-9]+.[0-9]+-*"    # pré-versions (canal beta), ex. v1.3.0-beta.1

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Générer les notes de version
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Construire l'artefact de mise à jour
        run: |
          tar czf "hestia-${GITHUB_REF_NAME}.tar.gz" \
            src pyproject.toml uv.lock VERSION README.md

      - name: Signer l'artefact (Ed25519)
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY absent : artefact NON signé. Les"
            echo "::warning::Raspberry Pi refuseront cette version (signature requise)."
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > signing-key.pem
          openssl pkeyutl -sign -inkey signing-key.pem -rawin \
            -in "hestia-${GITHUB_REF_NAME}.tar.gz" \
            -out "hestia-${GITHUB_REF_NAME}.tar.gz.sig"
          rm -f signing-key.pem

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Hestia ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          # Un tag contenant « - » (ex. v1.3.0-beta.1) est marqué pré-version :
          # il n'atteint que le canal beta (voir hestia.updater.sources).
          prerelease: ${{ contains(github.ref_name, '-') }}
          # La signature n'est jointe que si la clé est configurée ; sans elle,
          # la release reste ignorée par les appareils (paire artefact+.sig requise).
          files: |
            hestia-${{ github.ref_name }}.tar.gz
            hestia-${{ github.ref_name }}.tar.gz.sig

      # Déploiement vers la flotte (rollout progressif beta -> stable par paliers)
      # géré côté serveur de mise à jour : ne jamais pousser sur 100 % d'un coup.

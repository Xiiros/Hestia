name: CI

# Contrôles lancés sur chaque Pull Request vers main ou une branche de release.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - "release/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  titre-pr:
    name: Titre de PR (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      # Le merge se fait en « squash » : le titre de la PR devient le message de
      # commit sur main. On vérifie donc qu'il respecte les Conventional Commits.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

  tests:
    name: Lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Installer les dépendances
        run: uv sync --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format (ruff)
        run: uv run ruff format --check .
      - name: Tests (pytest)
        run: uv run pytest -q
